name: Bug report
description: Report a reproducible defect in microhealth
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Provide a minimal, reproducible report. Include exact configuration and observed behavior.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Compiler, OS, architecture, and build mode.
      placeholder: gcc 14 on Ubuntu 24.04 x86_64, C99, sanitizer build
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Repository state
      description: Commit SHA, branch, and any local modifications.
      placeholder: commit abc1234 on master, clean tree
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact commands, code snippet, or fixture needed to reproduce.
      placeholder: |
        1. Configure with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      description: Paste compiler output, test failures, sanitizer reports, or formatted snapshots.
      render: text

