name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install
        run: cmake --install build --prefix install
      - name: External consumer
        run: |
          cmake -S tests/install_consumer -B build/install-consumer -G Ninja -DCMAKE_PREFIX_PATH=$PWD/install -DCMAKE_C_COMPILER=gcc
          cmake --build build/install-consumer

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archives
        run: |
          git archive --format=tar.gz --output=microhealth-${GITHUB_REF_NAME}.tar.gz --prefix=microhealth-${GITHUB_REF_NAME}/ ${GITHUB_SHA}
          git archive --format=zip --output=microhealth-${GITHUB_REF_NAME}.zip --prefix=microhealth-${GITHUB_REF_NAME}/ ${GITHUB_SHA}
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            microhealth-${{ github.ref_name }}.tar.gz
            microhealth-${{ github.ref_name }}.zip
