name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc clang g++
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install
        run: cmake --install build --prefix install
      - name: External consumer
        run: |
          cmake -S tests/install_consumer -B build/install-consumer -G Ninja -DCMAKE_PREFIX_PATH=$PWD/install -DCMAKE_C_COMPILER=${{ matrix.cc }}
          cmake --build build/install-consumer

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang clang-tidy clang-tools cppcheck
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build
      - name: clang-tidy
        run: clang-tidy src/mhealth.c -- -Iinclude
      - name: cppcheck
        run: cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --std=c99 --language=c include src tests
      - name: scan-build
        run: scan-build cmake --build build

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G "NMake Makefiles"
      - name: Build
        shell: cmd
        run: cmake --build build
      - name: Test
        shell: cmd
        run: ctest --test-dir build --output-on-failure
      - name: Install and consume
        shell: cmd
        run: |
          cmake --install build --prefix install
          cmake -S tests/install_consumer -B build/install-consumer -G "NMake Makefiles" -DCMAKE_PREFIX_PATH=%GITHUB_WORKSPACE%\install
          cmake --build build/install-consumer

  windows-clangcl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G "NMake Makefiles" -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
      - name: Build
        shell: cmd
        run: cmake --build build
      - name: Test
        shell: cmd
        run: ctest --test-dir build --output-on-failure

  arm-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      - name: Compile core
        run: arm-none-eabi-gcc -std=c99 -Wall -Wextra -Wpedantic -Iinclude -c src/mhealth.c -o mhealth.o
      - name: Compile consumer
        run: arm-none-eabi-gcc -std=c99 -Wall -Wextra -Wpedantic -Iinclude -c tests/readme_example.c -o readme_example.o
